<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>준서 효은 아카이브</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Gaegu', cursive;
  background: #FFF9F0;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
.header {
  text-align: center;
  padding: 2.2rem 1rem 1.6rem;
  background: linear-gradient(160deg, #FFE4EC 0%, #FFF5C0 60%, #FFE4EC 100%);
  border-bottom: 6px solid #8B5E3C;
  position: relative;
  overflow: hidden;
}
.header-bg {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 15% 40%, rgba(255,179,198,.35) 0%, transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(255,224,102,.45) 0%, transparent 45%);
}
.deco {
  position: absolute; font-size: 1.4rem;
  animation: fd 3s ease-in-out infinite;
}
.deco:nth-child(1) { top:12px; left:6%;   animation-delay:0s   }
.deco:nth-child(2) { top:16px; right:8%;  animation-delay:.7s  }
.deco:nth-child(3) { bottom:14px; left:13%; animation-delay:1.3s }
.deco:nth-child(4) { bottom:10px; right:7%; animation-delay:.4s  }
.deco:nth-child(5) { top:8px; left:44%;  animation-delay:1s   }
@keyframes fd {
  0%,100% { transform: translateY(0) rotate(-6deg) }
  50%     { transform: translateY(-9px) rotate(6deg) }
}
h1 {
  font-family: 'Nanum Pen Script', cursive;
  font-size: clamp(2.2rem, 6.5vw, 4rem);
  color: #3D2B1F;
  position: relative; z-index: 1;
  text-shadow: 3px 3px 0 #FFB3C6, 7px 7px 0 rgba(255,179,198,.22);
  line-height: 1.15;
}
.sub {
  font-size: .95rem; color: #FF5C8A;
  margin-top: .3rem; letter-spacing: .1em;
  position: relative; z-index: 1;
}

/* ANNIVERSARY BANNER */
.anni {
  background: linear-gradient(135deg, #fff0f5 0%, #fffbe6 100%);
  border-bottom: 3px solid #FFB3C6;
  padding: .85rem 1rem;
  text-align: center;
}
.dday {
  font-family: 'Nanum Pen Script', cursive;
  font-size: clamp(1.5rem, 4.5vw, 2.2rem);
  color: #FF5C8A;
}
.chips {
  display: flex; gap: .45rem;
  flex-wrap: wrap; justify-content: center;
  margin-top: .45rem;
}
.chip {
  font-size: .76rem; padding: .2rem .65rem;
  border-radius: 99px; font-weight: 700; white-space: nowrap;
}
.chip.past   { background: #e8e8e8; color: #999 }
.chip.today  { background: #FF5C8A; color: #fff; animation: pulse 1.2s ease-in-out infinite }
.chip.future { background: #FFF5C0; color: #A67240; border: 1.5px solid #F5C800 }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

/* CALENDAR NAV */
.calnav {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1rem; gap: .5rem;
  background: #FFE4EC; border-bottom: 3px dashed #FF8FAB;
  flex-wrap: wrap;
}
.arrows { display: flex; gap: .35rem; align-items: center; }
.arr-btn {
  font-family: 'Gaegu', cursive; font-size: 1rem;
  padding: .25rem .7rem; border-radius: 99px;
  border: 2px solid #FF8FAB; background: #fff;
  color: #3D2B1F; cursor: pointer; transition: all .2s;
}
.arr-btn:hover { background: #FF8FAB; color: #fff; transform: scale(1.08) }
.datelabel {
  font-family: 'Nanum Pen Script', cursive;
  font-size: 1.3rem; color: #3D2B1F;
  min-width: 120px; text-align: center;
}
.today-btn {
  font-family: 'Gaegu', cursive; font-size: .8rem;
  padding: .2rem .75rem; border-radius: 99px;
  border: 2px solid #FF5C8A; background: #FF5C8A;
  color: #fff; cursor: pointer; transition: all .2s; display: block; margin-top: .15rem;
}
.today-btn:hover { transform: scale(1.08) }

/* ADD BUTTON */
.addbar {
  display: flex; justify-content: center;
  padding: .75rem 1rem;
  background: #FFE4EC; border-bottom: 3px dashed #FF8FAB;
}
.add-btn {
  font-family: 'Gaegu', cursive; font-size: 1rem;
  padding: .5rem 1.6rem; border-radius: 99px;
  border: 2.5px solid #FF8FAB; background: #FFE066;
  color: #3D2B1F; cursor: pointer;
  box-shadow: 0 4px 0 #F5C800; transition: all .2s;
  display: flex; align-items: center; gap: .4rem;
}
.add-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 #F5C800 }
.add-btn:active { transform: translateY(2px);  box-shadow: 0 2px 0 #F5C800 }

/* CORKBOARD */
.board {
  min-height: 500px; padding: 3rem 2rem 4rem;
  position: relative;
  background-color: #C8955C;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(0,0,0,.022) 3px, rgba(0,0,0,.022) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,.022) 3px, rgba(0,0,0,.022) 4px),
    radial-gradient(ellipse at 25% 20%, rgba(222,184,138,.5) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 75%, rgba(155,110,60,.4) 0%, transparent 50%);
  border: 8px solid #8B5E3C;
  box-shadow: inset 0 0 50px rgba(0,0,0,.22), 0 8px 32px rgba(0,0,0,.28);
}
.board::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, rgba(139,94,60,.18) 1px, transparent 0);
  background-size: 16px 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 3rem 2rem; position: relative; z-index: 1;
}
.empty {
  grid-column: 1/-1; text-align: center;
  color: rgba(255,255,255,.65); padding: 4rem 2rem;
}
.empty .ei { font-size: 3rem; display: block; margin-bottom: .7rem }
.empty p { font-size: 1rem; line-height: 2 }

/* CARD */
.cardwrap {
  display: flex; flex-direction: column; align-items: center;
  position: relative;
  animation: popin .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popin {
  from { opacity:0; transform: scale(.5) rotate(-8deg) }
  to   { opacity:1 }
}
.pin {
  position: absolute; top: -15px; z-index: 10;
  width: 24px; height: 24px; border-radius: 50%;
  box-shadow: 0 4px 10px rgba(0,0,0,.5);
  border: 1.5px solid rgba(255,255,255,.4);
}
.flipcard { width: 100%; perspective: 900px; cursor: pointer }
.flipinner {
  position: relative; width: 100%;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.4,.2,.2,1);
}
.flipcard.flipped .flipinner { transform: rotateY(180deg) }
.cfront, .cback {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 3px;
  box-shadow: 4px 10px 24px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.18);
}

/* FRONT: polaroid */
.cfront {
  background: #fff; padding: 9px 9px 36px; width: 100%;
  transform: rotate(var(--tilt, 0deg)); transition: transform .2s;
}
.cfront:hover { transform: rotate(0deg) scale(1.03) }
.cfront img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:1px }
.ctitle {
  text-align: center; margin-top: 5px;
  font-family: 'Nanum Pen Script', cursive; font-size: 1.1rem;
  color: #3D2B1F; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;
}

/* BACK: memo note */
.cback {
  position: absolute; inset: 0;
  transform: rotateY(180deg);
  padding: 14px 12px 10px;
  display: flex; flex-direction: column; gap: 6px;
}
.cback::after {
  content:''; position:absolute; inset:38px 10px 10px; pointer-events:none;
  background-image: repeating-linear-gradient(transparent,transparent 22px,rgba(0,0,0,.07) 22px,rgba(0,0,0,.07) 23px);
}
.bmemo-title {
  font-size: 1.1rem; font-weight: 700; color: #3D2B1F;
  line-height: 1.3; position: relative; z-index: 1;
}
.bmemo-text {
  font-size: .88rem; color: #5a4035; flex: 1; line-height: 1.7;
  overflow-y: auto; position: relative; z-index: 1;
}
.bmemo-date { font-size: .7rem; color: #bbb; text-align: right; position: relative; z-index: 1 }
.bmemo-hint { font-size: .68rem; color: rgba(0,0,0,.25); text-align: center; position: relative; z-index: 1 }
.bdel {
  position: absolute; top: 5px; right: 6px;
  background: none; border: none; font-size: .8rem;
  color: rgba(0,0,0,.25); cursor: pointer; z-index: 2;
  padding: 2px 4px; border-radius: 4px; transition: color .15s, background .15s;
}
.bdel:hover { color: #e00; background: rgba(255,0,0,.08) }

/* MODAL */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(61,43,31,.62); backdrop-filter: blur(5px);
  z-index: 100; align-items: center; justify-content: center; padding: 1rem;
}
.overlay.open { display: flex }
.mbox {
  background: #fff; border-radius: 22px;
  padding: 1.8rem 1.7rem 1.6rem; width: 100%; max-width: 390px;
  box-shadow: 0 24px 64px rgba(0,0,0,.3);
  border-top: 6px solid #FF8FAB; position: relative;
  animation: sup .32s cubic-bezier(.34,1.56,.64,1);
}
@keyframes sup { from{opacity:0;transform:translateY(50px) scale(.94)} to{opacity:1;transform:none} }
.mtitle {
  font-family: 'Nanum Pen Script', cursive; font-size: 1.6rem;
  color: #3D2B1F; text-align: center; margin-bottom: .9rem;
}
.mclose {
  position: absolute; top: .8rem; right: 1rem;
  background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #ccc;
}
.mclose:hover { color: #888 }
.imgpick {
  width: 100%; aspect-ratio: 1; background: #FFF5C0; border-radius: 14px;
  overflow: hidden; margin-bottom: .9rem; border: 2.5px dashed #F5C800;
  display: flex; align-items: center; justify-content: center;
  position: relative; cursor: pointer;
}
.imgpick img { width:100%; height:100%; object-fit:cover; display:block }
.imgpick-ph { text-align:center; color:#A67240; font-size:.9rem }
.imgpick-ph span { font-size:2rem; display:block; margin-bottom:.3rem }
.imgpick input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer }
.frow { margin-bottom: .75rem }
.flabel { display:block; font-size:.82rem; color:#A67240; margin-bottom:.25rem; font-weight:700 }
.finput, .ftextarea {
  width: 100%; font-family: 'Gaegu', cursive; font-size: 1rem;
  padding: .42rem .72rem; border-radius: 10px;
  border: 2px solid #FFB3C6; background: #FFE4EC; color: #3D2B1F;
  outline: none; transition: border-color .2s, background .2s;
}
.finput:focus, .ftextarea:focus { border-color: #FF5C8A; background: #fff }
.ftextarea { resize: vertical; min-height: 74px }
.mactions { display:flex; gap:.6rem; margin-top:.9rem }
.msave {
  flex:1; font-family:'Gaegu',cursive; font-size:1rem; padding:.52rem;
  border-radius:99px; border:2.5px solid #FF5C8A; background:#FF5C8A;
  color:#fff; cursor:pointer; transition:all .2s; box-shadow:0 4px 0 #c0004a;
}
.msave:hover  { transform:translateY(-2px); box-shadow:0 6px 0 #c0004a }
.msave:active { transform:translateY(2px);  box-shadow:0 2px 0 #c0004a }
.mcancel {
  font-family:'Gaegu',cursive; font-size:1rem; padding:.52rem 1rem;
  border-radius:99px; border:2px solid #ddd; background:#fff;
  color:#3D2B1F; cursor:pointer; transition:all .2s;
}
.mcancel:hover { background:#f5f5f5 }

/* TOAST */
.toast {
  position: fixed; bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #3D2B1F; color: #fff; padding: .6rem 1.5rem;
  border-radius: 99px; font-family: 'Gaegu', cursive; font-size: 1rem;
  opacity: 0; transition: all .3s; pointer-events: none; z-index: 300; white-space: nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0) }

@media (max-width: 500px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 2.5rem 1.2rem }
  .board { padding: 2.5rem 1rem 3rem }
  .arrows { gap: .25rem }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-bg"></div>
  <span class="deco">🌸</span>
  <span class="deco">⭐</span>
  <span class="deco">🌼</span>
  <span class="deco">🎀</span>
  <span class="deco">✨</span>
  <h1>준서 효은 아카이브</h1>
  <p class="sub">✦ 우리의 소중한 순간들 ✦</p>
</header>

<!-- ANNIVERSARY BANNER -->
<div class="anni">
  <div class="dday" id="ddayEl"></div>
  <div class="chips" id="chipsEl"></div>
</div>

<!-- CALENDAR NAV -->
<div class="calnav">
  <div class="arrows">
    <button class="arr-btn" id="prevMonth">◀◀</button>
    <button class="arr-btn" id="prevDay">◀</button>
  </div>
  <div style="text-align:center">
    <div class="datelabel" id="dateLabel"></div>
    <button class="today-btn" id="todayBtn">오늘로 ✦</button>
  </div>
  <div class="arrows">
    <button class="arr-btn" id="nextDay">▶</button>
    <button class="arr-btn" id="nextMonth">▶▶</button>
  </div>
</div>

<!-- ADD BAR -->
<div class="addbar">
  <button class="add-btn" id="addBtn">📷 이 날에 사진 추가하기</button>
</div>

<!-- BOARD -->
<main class="board">
  <div class="grid" id="grid"></div>
</main>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="mbox">
    <button class="mclose" id="mclose">✕</button>
    <div class="mtitle">📌 사진 추가하기</div>
    <div class="imgpick" id="imgpick">
      <input type="file" id="fileinput" accept="image/*">
      <div class="imgpick-ph" id="imgph"><span>🖼️</span>클릭해서 사진 선택</div>
      <img id="imgprev" style="display:none" alt="">
    </div>
    <div class="frow">
      <label class="flabel">제목</label>
      <input class="finput" id="titlein" type="text" placeholder="예: 첫 번째 데이트 🌸" maxlength="30">
    </div>
    <div class="frow">
      <label class="flabel">메모</label>
      <textarea class="ftextarea" id="memoin" placeholder="이 날의 기억을 적어봐요 💕" maxlength="200"></textarea>
    </div>
    <div class="mactions">
      <button class="mcancel" id="mcancel">취소</button>
      <button class="msave" id="msave">📌 저장하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 설정 ──
var START = new Date(2025, 5, 6); // 2025년 6월 6일 (month는 0부터)

// 사진 배열 색 (메모지 뒷면)
var NOTECOLS = [
  { bg:'#FFF5C0', top:'#F5C800', pin:'#C89A00' },
  { bg:'#FFE4EC', top:'#FF8FAB', pin:'#FF5C8A' },
  { bg:'#E4F5EC', top:'#4CAF7A', pin:'#2D7A4F' },
  { bg:'#E4ECFF', top:'#5B8FFF', pin:'#2563EB' },
  { bg:'#F3E4FF', top:'#C97BFF', pin:'#9333EA' },
];
var TILTS = [-3, -1.5, 0, 1.5, 3, -2.5, 2, -1, 2.5];

// ── 데이터 ──
var photos = [];
try { photos = JSON.parse(localStorage.getItem('jhe_v4') || '[]'); } catch(e) {}

// ── 뷰 날짜 ──
var today = new Date();
today.setHours(0,0,0,0);
var vy = today.getFullYear(), vm = today.getMonth()+1, vd = today.getDate();

// ── 기념일 계산 ──
function msDay() { return 1000*60*60*24; }
function addDays(base, n) {
  var d = new Date(base.getTime());
  d.setDate(d.getDate() + n);
  return d;
}
function buildAnnis() {
  var list = [];
  for (var i = 100; i <= 3650; i += 100) {
    list.push({ label: '+' + i + '일', date: addDays(START, i-1) });
  }
  for (var y = 1; y <= 10; y++) {
    var d = new Date(START.getTime());
    d.setFullYear(d.getFullYear() + y);
    list.push({ label: y + '주년', date: d });
  }
  list.sort(function(a,b){ return a.date - b.date; });
  return list;
}
var ANNIS = buildAnnis();

function renderAnniBanner() {
  var now = new Date(); now.setHours(0,0,0,0);
  var daysSince = Math.floor((now - START) / msDay()) + 1;
  document.getElementById('ddayEl').innerHTML = '준서 &amp; 효은 &nbsp;<strong>+' + daysSince + 'day</strong> 💕';

  var past=[], todayA=[], future=[];
  for (var i=0; i<ANNIS.length; i++) {
    var ad = new Date(ANNIS[i].date); ad.setHours(0,0,0,0);
    var diff = ad - now;
    if (diff < 0) past.push(ANNIS[i]);
    else if (diff === 0) todayA.push(ANNIS[i]);
    else future.push(ANNIS[i]);
  }

  var show = [];
  if (past.length > 0) show.push({ a: past[past.length-1], state: 'past' });
  for (var j=0; j<todayA.length; j++) show.push({ a: todayA[j], state: 'today' });
  for (var k=0; k<Math.min(3, future.length); k++) show.push({ a: future[k], state: 'future' });

  var html = '';
  for (var n=0; n<show.length; n++) {
    var item = show[n];
    var d = new Date(item.a.date);
    var ds = (d.getMonth()+1) + '/' + d.getDate();
    var daysLeft = Math.round((d - now) / msDay());
    var text = item.state === 'past'
      ? '✓ ' + item.a.label + ' (' + ds + ')'
      : item.state === 'today'
      ? '🎉 오늘! ' + item.a.label
      : item.a.label + ' (' + ds + ', D-' + daysLeft + ')';
    html += '<div class="chip ' + item.state + '">' + text + '</div>';
  }
  document.getElementById('chipsEl').innerHTML = html;
}

// ── 날짜 키 ──
function dateKey(y, m, d) {
  return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function viewKey() { return dateKey(vy, vm, vd); }
function todayKey() { return dateKey(today.getFullYear(), today.getMonth()+1, today.getDate()); }

// ── 캘린더 레이블 ──
var DAY_NAMES = ['일','월','화','수','목','금','토'];
function updateLabel() {
  var jsD = new Date(vy, vm-1, vd);
  var isToday = viewKey() === todayKey();
  document.getElementById('dateLabel').textContent =
    vy + '.' + String(vm).padStart(2,'0') + '.' + String(vd).padStart(2,'0') +
    ' (' + DAY_NAMES[jsD.getDay()] + ')' + (isToday ? ' ✦' : '');
}

// ── 네비게이션 ──
function shiftDay(n) {
  var d = new Date(vy, vm-1, vd);
  d.setDate(d.getDate() + n);
  vy = d.getFullYear(); vm = d.getMonth()+1; vd = d.getDate();
  updateLabel(); renderBoard();
}
function shiftMonth(n) {
  vm += n;
  while (vm > 12) { vm -= 12; vy++; }
  while (vm < 1)  { vm += 12; vy--; }
  var maxD = new Date(vy, vm, 0).getDate();
  if (vd > maxD) vd = maxD;
  updateLabel(); renderBoard();
}

document.getElementById('prevDay').onclick    = function(){ shiftDay(-1); };
document.getElementById('nextDay').onclick    = function(){ shiftDay(1);  };
document.getElementById('prevMonth').onclick  = function(){ shiftMonth(-1); };
document.getElementById('nextMonth').onclick  = function(){ shiftMonth(1);  };
document.getElementById('todayBtn').onclick   = function(){
  vy = today.getFullYear(); vm = today.getMonth()+1; vd = today.getDate();
  updateLabel(); renderBoard();
};
document.addEventListener('keydown', function(e) {
  if (document.getElementById('overlay').classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  shiftDay(-1);
  if (e.key === 'ArrowRight') shiftDay(1);
});

// ── 모달 ──
var pendingSrc = null;

function openModal() {
  pendingSrc = null;
  document.getElementById('imgprev').style.display = 'none';
  document.getElementById('imgph').style.display   = 'block';
  document.getElementById('titlein').value = '';
  document.getElementById('memoin').value  = '';
  document.getElementById('fileinput').value = '';
  document.getElementById('overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('addBtn').onclick  = openModal;
document.getElementById('mclose').onclick  = closeModal;
document.getElementById('mcancel').onclick = closeModal;
document.getElementById('overlay').onclick = function(e) {
  if (e.target === this) closeModal();
};

document.getElementById('fileinput').onchange = function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    pendingSrc = ev.target.result;
    var img = document.getElementById('imgprev');
    img.src = pendingSrc;
    img.style.display = 'block';
    document.getElementById('imgph').style.display = 'none';
  };
  reader.readAsDataURL(file);
};

document.getElementById('msave').onclick = function() {
  if (!pendingSrc) { showToast('사진을 먼저 선택해주세요! 📷'); return; }
  var title = document.getElementById('titlein').value.trim() || '제목 없음';
  var memo  = document.getElementById('memoin').value.trim();
  var key   = viewKey();
  photos.unshift({ id: Date.now(), src: pendingSrc, title: title, memo: memo, dk: key });
  save(); renderBoard(); closeModal();
  showToast('소중한 순간이 저장됐어요 💕');
};

// ── 렌더 ──
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBoard() {
  var grid = document.getElementById('grid');
  var key  = viewKey();
  var list = photos.filter(function(p){ return p.dk === key; });
  grid.innerHTML = '';

  if (list.length === 0) {
    grid.innerHTML =
      '<div class="empty"><span class="ei">📌</span><p>' +
      vy + '년 ' + vm + '월 ' + vd + '일의<br>사진이 아직 없어요<br>위 버튼으로 이 날의 순간을 남겨봐요!</p></div>';
    return;
  }

  for (var i=0; i<list.length; i++) {
    var photo = list[i];
    var col   = NOTECOLS[i % NOTECOLS.length];
    var tilt  = TILTS[i % TILTS.length];

    var wrap = document.createElement('div');
    wrap.className = 'cardwrap';
    wrap.style.animationDelay = (i * 0.06) + 's';

    // pushpin
    var pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.background =
      'radial-gradient(circle at 35% 32%, rgba(255,255,255,.9) 0%, ' + col.pin + ' 45%, rgba(0,0,0,.35) 100%)';

    // flipcard
    var fc = document.createElement('div');
    fc.className = 'flipcard';

    var fi = document.createElement('div');
    fi.className = 'flipinner';

    // FRONT
    var front = document.createElement('div');
    front.className = 'cfront';
    front.style.setProperty('--tilt', tilt + 'deg');
    front.innerHTML =
      '<img src="' + photo.src + '" alt="" loading="lazy">' +
      '<div class="ctitle">' + esc(photo.title) + '</div>';

    // BACK
    var back = document.createElement('div');
    back.className = 'cback';
    back.style.background = col.bg;
    back.style.borderTop  = '4px solid ' + col.top;
    back.innerHTML =
      '<button class="bdel">🗑️</button>' +
      '<div class="bmemo-title">' + esc(photo.title) + '</div>' +
      '<div class="bmemo-text">'  + esc(photo.memo)  + (photo.memo ? '' : '메모가 없어요 🌸') + '</div>' +
      '<div class="bmemo-date">'  + (photo.dk || '') + '</div>' +
      '<div class="bmemo-hint">↩ 탭해서 돌아가기</div>';

    (function(pid, ptitle) {
      back.querySelector('.bdel').onclick = function(e) {
        e.stopPropagation();
        if (confirm('"' + ptitle + '" 사진을 삭제할까요?')) {
          photos = photos.filter(function(p){ return p.id !== pid; });
          save(); renderBoard();
          showToast('삭제됐어요');
        }
      };
    })(photo.id, photo.title);

    fc.onclick = function() { this.classList.toggle('flipped'); };

    fi.appendChild(front);
    fi.appendChild(back);
    fc.appendChild(fi);
    wrap.appendChild(pin);
    wrap.appendChild(fc);
    grid.appendChild(wrap);
  }
}

function save() {
  try { localStorage.setItem('jhe_v4', JSON.stringify(photos)); }
  catch(e) { showToast('저장 공간이 부족해요 😅'); }
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ── 시작 ──
renderAnniBanner();
updateLabel();
renderBoard();
</script>
</body>
</html>
